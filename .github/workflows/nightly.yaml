name: Nightly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  detect-ci-trigger:
    name: detect upstream-dev ci trigger
    runs-on: ubuntu-latest
    if: |
      github.repository == 'xarray-contrib/sphinx-autosummary-accessors'
      && (github.event_name == 'push' || github.event_name == 'pull_request')
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715 # v1.2.1
        id: detect-trigger
        with:
          keyword: "[test-upstream]"

  upstream-dev:
    name: upstream-dev
    runs-on: ubuntu-latest
    needs: detect-ci-trigger

    if: |
      always()
      && (
        github.event_name == 'schedule'
        || (
          github.event_name == 'pull_request'
          && (
            needs.detect-ci-trigger.outputs.triggered == 'true'
            || contains(github.event.pull_request.labels.*.name, 'run-upstream')
          )
        )
      )

    strategy:
      fail-fast: false
      matrix:
        env: ["nightly"]

    env:
      ENV: ${{ matrix.env }}
      LOGFILE: "output-${{ matrix.env }}-log"

    outputs:
      artifacts_availability: ${{ steps.status.outputs.ARTIFACTS_AVAILABLE }}

    steps:
      - name: checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # need to fetch all tags to get a correct version
          fetch-depth: 0 # fetch all branches and tags
          persist-credentials: false

      - name: setup pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: ${{ matrix.env }}
          manifest-path: ci/nightly
          cache: false

      - name: import sphinx_autosummary_accessors
        run: |
          pixi run --manifest-path ci/nightly -e $ENV python -c 'import sphinx_autosummary_accessors'

      - name: build the documentation
        run: |
          ci/nightly/tee.sh "$LOGFILE" pixi run --manifest-path ci/nightly -e $ENV build-docs
          result=$?

          if [[ $result != 0 ]]; then
            echo "ARTIFACTS_AVAILABE=true" >> $GITHUB_OUTPUT
            exit $result
          else
            echo "ARTIFACTS_AVAILABE=false" >> $GITHUB_OUTPUT
          fi

      - name: upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logfile
          path: ${{ env.LOGFILE }}

  report:
    name: Report
    runs-on: ubuntu-latest
    needs: upstream-dev
    if: |
      always()
      && github.event_name == 'schedule'
      && github.repository == 'xarray-contrib/sphinx-autosummary-accessors'
      && needs.upstream-dev.outputs.artifacts_availability == 'true'

    permissions:
      issues: write # create or modify upstream-dev issues

    steps:
      - name: checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup pixi
        uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
        with:
          environments: ${{ matrix.env }}
          cache: false

      - name: download logs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: logfile
          path: logs

      - name: Parse logs
        env:
          WORKFLOW_URL: "https://github.com/${{ env.GITHUB_REPOSITORY }}/actions/runs/${{ env.GITHUB_RUN_ID }}"
        run: |
          pixi run parse-logs "$WORKFLOW_URL" logs/*-log sphinx-log.txt

      - name: Report failures
        env:
          ISSUE_LABEL: "CI"
          ISSUE_TITLE: "⚠️ Nightly upstream-dev CI failed ⚠️"
          CREATOR: "app/github-actions"
          ISSUE_BODY: "sphinx-log.txt"
          GH_TOKEN: ${{ github.token }}
        run: |
          issues=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            -S "in:title $ISSUE_TITLE" \
            --state open \
            --author $CREATOR \
            --json number,title,author \
            -L 1
          );

          if [[ $(echo "$issues" | jq 'length') -eq 1 ]]; then
            gh issue edit \
              --repo "$GITHUB_REPOSITORY" \
              "$(echo "$issues" | jq '.[] | .number')" \
              --body-file "$ISSUE_BODY"
          else
            gh issue new \
              --repo "$GITHUB_REPOSITORY" \
              --label "$ISSUE_LABEL" \
              --title "$ISSUE_TITLE" \
              --body-file $ISSUE_BODY
          fi
