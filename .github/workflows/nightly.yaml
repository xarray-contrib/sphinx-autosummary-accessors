name: Nightly CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 3

permissions: {}

jobs:
  detect-ci-trigger:
    name: detect upstream-dev ci trigger
    runs-on: ubuntu-slim
    if: |
      github.repository == 'xarray-contrib/sphinx-autosummary-accessors'
      && (github.event_name == 'push' || github.event_name == 'pull_request')
    outputs:
      triggered: ${{ steps.detect-trigger.outputs.trigger-found }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: xarray-contrib/ci-trigger@10cd2bfec3484946a4058a421ddf9cfad101e715 # v1.2.1
        id: detect-trigger
        with:
          keyword: "[test-upstream]"

  upstream-dev:
    name: upstream-dev
    runs-on: ubuntu-latest
    needs: detect-ci-trigger

    if: |
      always()
      && (
        github.event_name == 'schedule'
        || github.event_name == 'workflow_dispatch'
        || needs.detect-ci-trigger.outputs.triggered == 'true'
      )

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    outputs:
      log-file: ${{ steps.log-path.outputs.log-file }}

    steps:
      - name: checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: setup python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: upgrade pip
        run: python -m pip install --upgrade pip

      - name: install sphinx
        run: python -m pip install "git+https://github.com/sphinx-doc/sphinx"

      - name: install other dependencies
        run: python -m pip install -r ci/requirements.txt

      - name: install the extension
        run: python -m pip install .

      - name: show versions
        run: python -m pip list

      - name: import sphinx_autosummary_accessors
        run: python -c 'import sphinx_autosummary_accessors'

      - name: determine log path
        id: log-path
        run: echo "log-file=output-${{ matrix.python-version }}-log" >> "$GITHUB_OUTPUT"

      - name: build the documentation
        env:
          LOG_FILE: ${{ steps.log-path.outputs.log-file }}
        run: |
          set -euo pipefail
          cd docs
          python -m sphinx -M html -d _build/doctrees -EWT -a . _build/html \
            2>&1 | tee "../${LOG_FILE}"

      - name: upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output-${{ matrix.python-version }}
          path: ${{ steps.log-path.outputs.log-file }}

  report:
    name: Report
    runs-on: ubuntu-slim
    needs: upstream-dev
    if: |
      always()
      && needs.upstream-dev.result == 'failure'
      && github.event_name == 'schedule'
      && github.repository == 'xarray-contrib/sphinx-autosummary-accessors'

    permissions:
      issues: write

    steps:
      - name: checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/workspace/logs

      - name: move log files into a single directory
        run: |
          mkdir -p logs
          find /tmp/workspace/logs -type f -name 'output-*-log' -exec cp {} logs/ \;
          ls -R logs

      - name: parse logs
        run: python .github/workflows/format-logs.py logs/output-*-log sphinx-log.txt

      - name: report failures
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "⚠️ Nightly upstream-dev CI failed ⚠️";
            const workflowUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = `[Workflow Run URL](${workflowUrl})\n${fs.readFileSync("sphinx-log.txt", "utf8")}`;

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue is:open in:title "${title}"`,
              per_page: 1,
            });

            if (data.items.length === 0) {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["CI"],
              });
            } else {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: data.items[0].number,
                body,
              });
            }
